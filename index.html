<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>Jurnal Sală</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d; --panel:#171717; --panel2:#1f1f1f; --line:#2c2c2c;
    --ink:#f5f5f3; --mut:#8d8d88; --acc:#f2d21e; --acc-d:#c9ad12;
    --good:#46d17a; --warn:#ff6b4a;
    --disp:'Barlow Condensed',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  body{padding-bottom:150px}
  button{font-family:inherit;cursor:pointer;border:none}
  input{font-family:inherit}

  /* Header */
  header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
  .brand .mark{width:14px;height:26px;background:var(--acc);transform:skewX(-12deg)}
  .brand h1{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.5px;margin:0;text-transform:uppercase}
  .brand h1 span{color:var(--acc)}

  .weekbar{display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 16px 12px}
  .weekbar button{background:var(--panel2);color:var(--ink);width:46px;height:46px;border-radius:12px;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .weekbar button:active{background:var(--acc);color:#000}
  .weeklabel{font-family:var(--disp);font-weight:700;text-transform:uppercase;text-align:center;min-width:120px}
  .weeklabel b{display:block;font-size:30px;line-height:1;color:var(--acc)}
  .weeklabel small{font-size:12px;color:var(--mut);letter-spacing:2px}

  .days{display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto}
  .day{flex:1;min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .day.active{background:var(--acc);border-color:var(--acc)}
  .day .dn{font-family:var(--disp);font-weight:800;font-size:19px;text-transform:uppercase;color:var(--ink)}
  .day.active .dn{color:#000}
  .day .ds{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
  .day.active .ds{color:#3a3000}

  main{padding:14px 12px 0}

  /* Exercise card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:14px}
  .card.done{border-color:var(--acc-d)}
  .ex-top{display:flex;align-items:flex-start;gap:10px}
  .ex-num{font-family:var(--disp);font-weight:800;font-size:34px;line-height:.9;color:var(--acc);min-width:34px}
  .ex-meta{flex:1}
  .ex-name{font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.05;text-transform:uppercase}
  .ex-eq{font-size:12px;color:var(--mut);margin-top:3px}
  .chip{display:inline-block;background:var(--panel2);color:var(--acc);font-family:var(--disp);font-weight:700;font-size:15px;padding:3px 10px;border-radius:8px;white-space:nowrap}

  .last{margin:12px 0 4px;font-size:13px;color:var(--mut);background:var(--panel2);border-radius:10px;padding:8px 10px}
  .last b{color:var(--ink);font-weight:700}
  .last.beat b{color:var(--good)}

  .grid{display:grid;grid-template-columns:96px 1fr;gap:10px;margin-top:10px;align-items:end}
  .field label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .kg input{width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--disp);font-weight:800;font-size:30px;text-align:center;padding:8px 4px}
  .sets{display:flex;gap:8px}
  .set{flex:1}
  .set span{display:block;font-size:10px;color:var(--mut);text-align:center;margin-bottom:4px;letter-spacing:1px}
  .set input{width:100%;background:var(--panel2);border:2px solid var(--line);border-radius:12px;color:var(--ink);font-family:var(--disp);font-weight:800;font-size:26px;text-align:center;padding:8px 2px}
  .kg input:focus,.set input:focus{outline:none;border-color:var(--acc)}
  .set input::placeholder{color:#4a4a47}

  .restbtn{margin-top:12px;width:100%;background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:11px;font-family:var(--disp);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:1px}
  .restbtn:active{border-color:var(--acc);color:var(--acc)}

  /* Timer dock */
  .timer{position:fixed;left:0;right:0;bottom:64px;z-index:25;background:#000;border-top:1px solid var(--line);padding:10px 12px 12px}
  .timer-row{display:flex;align-items:center;gap:12px}
  .clock{font-family:var(--disp);font-weight:800;font-size:48px;line-height:1;letter-spacing:1px;min-width:130px;text-align:center}
  .clock.run{color:var(--acc)} .clock.zero{color:var(--warn)}
  .presets{display:flex;gap:7px;flex:1;flex-wrap:wrap}
  .presets button{background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 0;flex:1;min-width:48px;font-family:var(--disp);font-weight:700;font-size:16px}
  .presets button:active{background:var(--acc);color:#000}
  .tctl{display:flex;gap:7px;margin-top:8px}
  .tctl button{flex:1;border-radius:10px;padding:10px;font-family:var(--disp);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:1px}
  .b-start{background:var(--acc);color:#000} .b-ghost{background:var(--panel2);color:var(--ink)}

  /* Bottom nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:26;display:flex;background:#000;border-top:1px solid var(--line)}
  nav button{flex:1;background:transparent;color:var(--mut);padding:11px 0 13px;font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1.5px}
  nav button.active{color:var(--acc)}

  /* Progres view */
  .ov-day{font-family:var(--disp);font-weight:800;font-size:21px;text-transform:uppercase;color:var(--acc);margin:18px 4px 8px;letter-spacing:.5px}
  .ov{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .ov h4{font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;margin:0 0 8px}
  .hist{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:var(--panel2);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--mut)}
  .pill b{font-family:var(--disp);font-size:16px;color:var(--ink);font-weight:700}
  .pr{color:var(--acc);font-size:12px;margin-top:8px;font-weight:600}
  .empty{color:var(--mut);font-size:13px}

  .data{margin:22px 4px 30px}
  .data h3{font-family:var(--disp);text-transform:uppercase;font-size:18px;color:var(--mut);letter-spacing:1px}
  .data .row{display:flex;gap:8px;margin-top:8px}
  .data button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-weight:600}
  .data button.danger{color:var(--warn);border-color:#3a2420}
  .hint{color:var(--mut);font-size:12px;margin-top:10px;line-height:1.5}
  .hidden{display:none}
  .flash{animation:fl .5s ease 3}
  @keyframes fl{50%{background:#3a2f00}}

  .thumbwrap{margin-top:12px}
  .thumb{width:100%;max-height:160px;object-fit:contain;border-radius:12px;border:1px solid var(--line);display:block;background:#eee}
  .eqbadge{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--panel2);border-radius:12px;padding:11px 12px;color:var(--mut);font-size:13px}
  .eqbadge .dz{font-size:22px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:78vh;border-radius:14px;background:#fff}
  .lb .cap{color:var(--acc);font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;text-align:center}
  .lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:38px;background:none;line-height:1}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark"></div><h1>JURNAL<span>·</span>SALĂ</h1></div>
  <div class="weekbar">
    <button id="wPrev" aria-label="Săptămâna anterioară">‹</button>
    <div class="weeklabel"><small>SĂPTĂMÂNA</small><b id="wNum">1</b></div>
    <button id="wNext" aria-label="Săptămâna următoare">›</button>
  </div>
  <div class="days" id="days"></div>
</header>

<main id="viewWorkout"></main>
<main id="viewProgress" class="hidden"></main>

<div class="timer" id="timerDock">
  <div class="timer-row">
    <div class="clock" id="clock">1:30</div>
    <div class="presets">
      <button data-s="60">60s</button>
      <button data-s="90">90s</button>
      <button data-s="120">2:00</button>
      <button data-s="180">3:00</button>
    </div>
  </div>
  <div class="tctl">
    <button class="b-start" id="tStart">Start</button>
    <button class="b-ghost" id="tAdd">+15s</button>
    <button class="b-ghost" id="tReset">Reset</button>
  </div>
</div>

<div class="lb" id="lb"><button class="x" id="lbx">&times;</button><img id="lbimg" alt=""><div class="cap" id="lbcap"></div></div>

<nav>
  <button id="navW" class="active">Antrenament</button>
  <button id="navP">Progres</button>
</nav>

const DAY_ORDER = ["luni","miercuri","joi"];

const KEY="tg_journal_v1";

let state = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.log) return s; }catch(e){}
  return {week:1, day:"luni", log:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function cell(day,week,i){ return ((state.log[day]||{})[week]||{})[i] || null; }
function setCell(day,week,i,obj){
  state.log[day]=state.log[day]||{};
  state.log[day][week]=state.log[day][week]||{};
  state.log[day][week][i]=obj; save();
}

/* ---------- Workout view ---------- */
function renderDays(){
  const c=document.getElementById("days"); c.innerHTML="";
  DAY_ORDER.forEach(d=>{
    const el=document.createElement("button");
    el.className="day"+(d===state.day?" active":"");
    el.innerHTML=`<div class="dn">${DAY_LABEL[d]}</div><div class="ds">${PROGRAM[d].name}</div>`;
    el.onclick=()=>{ state.day=d; save(); renderDays(); renderWorkout(); };
    c.appendChild(el);
  });
}
function renderWorkout(){
  document.getElementById("wNum").textContent=state.week;
  const m=document.getElementById("viewWorkout"); m.innerHTML="";
  const day=state.day, prog=PROGRAM[day];
  prog.ex.forEach((ex,i)=>{
    const data=cell(day,state.week,i);
    const prev=state.week>1?cell(day,state.week-1,i):null;
    const pg=(EXIMG[day]||{})[i];
    const media = pg ? `<div class="thumbwrap"><img class="thumb" src="${IMG[pg]}" data-cap="${ex.eq}" loading="lazy"></div>`
                     : `<div class="eqbadge"><span class="dz">\u{1F3CB}</span> Greutate liberă · ${ex.eq}</div>`;
    const card=document.createElement("div");
    card.className="card"+(data&&data.sets&&data.sets.some(x=>x)?" done":"");

    let lastHtml="";
    if(prev && prev.sets && prev.sets.some(x=>x)){
      const reps=prev.sets.filter(x=>x!=="").join(" · ");
      lastHtml=`<div class="last"><b>Săpt. trecută:</b> ${prev.kg||"—"} kg → ${reps||"—"} &nbsp; <b>· bate cifrele!</b></div>`;
    } else {
      lastHtml=`<div class="last">Prima dată aici — alege o greutate la care prinzi capătul de jos al intervalului.</div>`;
    }

    const setInputs=Array.from({length:ex.sets}).map((_,s)=>{
      const v=data&&data.sets?data.sets[s]||"":"";
      return `<div class="set"><span>S${s+1}</span><input inputmode="numeric" data-i="${i}" data-s="${s}" value="${v}" placeholder="–"></div>`;
    }).join("");

    card.innerHTML=`
      <div class="ex-top">
        <div class="ex-num">${i+1}</div>
        <div class="ex-meta">
          <div class="ex-name">${ex.n}</div>
          <div class="ex-eq">${ex.eq}</div>
        </div>
        <div class="chip">${ex.t}</div>
      </div>
      ${media}
      ${lastHtml}
      <div class="grid">
        <div class="field kg"><label>Kg</label><input inputmode="decimal" data-i="${i}" data-kg="1" value="${data?data.kg||"":""}" placeholder="0"></div>
        <div class="field"><label>Repetări / serie</label><div class="sets">${setInputs}</div></div>
      </div>
      <button class="restbtn" data-rest="1">⏱ Pornește pauza (90s)</button>
    `;
    m.appendChild(card);
  });

  m.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const i=+inp.dataset.i, day=state.day, wk=state.week;
      let d=cell(day,wk,i)||{kg:"",sets:Array.from({length:prog.ex[i].sets}).map(()=>"")};
      d.kg=d.kg||""; d.sets=d.sets||[];
      if(inp.dataset.kg){ d.kg=inp.value; }
      else { d.sets[+inp.dataset.s]=inp.value; }
      setCell(day,wk,i,d);
    });
  });
  m.querySelectorAll('[data-rest]').forEach(b=> b.onclick=()=>startTimer(90));
  m.querySelectorAll('.thumb').forEach(t=> t.onclick=()=>{
    document.getElementById('lbimg').src=t.src;
    document.getElementById('lbcap').textContent=t.dataset.cap;
    document.getElementById('lb').classList.add('open');
  });
}

/* ---------- Progress view ---------- */
function bestKg(day,i){
  let best=0,bw=0;
  const d=state.log[day]||{};
  Object.keys(d).forEach(w=>{ const c=d[w][i]; if(c&&c.kg){ const k=parseFloat(c.kg); if(k>best){best=k;bw=+w;} }});
  return best?{kg:best,week:bw}:null;
}
function renderProgress(){
  const m=document.getElementById("viewProgress"); m.innerHTML="";
  DAY_ORDER.forEach(day=>{
    const dh=document.createElement("div"); dh.className="ov-day";
    dh.textContent=`${DAY_LABEL[day]} — ${PROGRAM[day].name}`; m.appendChild(dh);
    PROGRAM[day].ex.forEach((ex,i)=>{
      const d=state.log[day]||{};
      const weeks=Object.keys(d).map(Number).sort((a,b)=>a-b).filter(w=>d[w][i]&&(d[w][i].kg||(d[w][i].sets||[]).some(x=>x)));
      const ov=document.createElement("div"); ov.className="ov";
      let body;
      if(!weeks.length){ body=`<div class="empty">Încă nelogat</div>`; }
      else{
        const pills=weeks.slice(-8).map(w=>{
          const c=d[w][i]; const reps=(c.sets||[]).filter(x=>x!=="").join("·");
          return `<div class="pill">S${w} <b>${c.kg||"–"}kg</b> ${reps?("· "+reps):""}</div>`;
        }).join("");
        const pr=bestKg(day,i);
        body=`<div class="hist">${pills}</div>${pr?`<div class="pr">🏆 Record: ${pr.kg} kg (săpt. ${pr.week})</div>`:""}`;
      }
      ov.innerHTML=`<h4>${i+1}. ${ex.n}</h4>${body}`;
      m.appendChild(ov);
    });
  });
  const data=document.createElement("div"); data.className="data";
  data.innerHTML=`
    <h3>Datele tale</h3>
    <div class="row">
      <button id="expBtn">⬇ Exportă (backup)</button>
      <button id="impBtn">⬆ Importă</button>
    </div>
    <div class="row"><button class="danger" id="resetBtn">Șterge tot</button></div>
    <p class="hint">Datele se salvează în acest telefon/browser. Fă din când în când un Export ca backup — și ca să muți jurnalul pe alt dispozitiv.</p>
    <input type="file" id="impFile" accept="application/json" class="hidden">`;
  m.appendChild(data);
  document.getElementById("expBtn").onclick=exportData;
  document.getElementById("impBtn").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=importData;
  document.getElementById("resetBtn").onclick=()=>{ if(confirm("Sigur ștergi tot jurnalul? Acțiunea nu poate fi anulată.")){ state={week:1,day:"luni",log:{}}; save(); renderAll(); }};
}
function exportData(){
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="jurnal-sala-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(s&&s.log){ state=s; save(); renderAll(); alert("Import reușit."); } else alert("Fișier invalid."); }catch(err){ alert("Fișier invalid."); }};
  r.readAsText(f);
}

/* ---------- Timer ---------- */
let remain=90, tickId=null, audioCtx=null;
function fmt(s){ const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
function paintClock(){ const c=document.getElementById("clock"); c.textContent=fmt(remain);
  c.className="clock"+(tickId?" run":"")+(remain<=0?" zero":""); }
function startTimer(sec){
  if(sec){ remain=sec; }
  if(tickId) clearInterval(tickId);
  paintClock();
  tickId=setInterval(()=>{ remain--; if(remain<=0){ remain=0; paintClock(); stopTimer(); buzz(); }
    else paintClock(); },1000);
  document.getElementById("tStart").textContent="Pauză";
  paintClock();
}
function stopTimer(){ if(tickId){clearInterval(tickId);tickId=null;} document.getElementById("tStart").textContent="Start"; paintClock(); }
function buzz(){
  if(navigator.vibrate) navigator.vibrate([260,120,260]);
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,180,360].forEach(d=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+d/1000; g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.4,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
      o.start(t); o.stop(t+.18); }); }catch(e){}
  document.getElementById("timerDock").classList.add("flash");
  setTimeout(()=>document.getElementById("timerDock").classList.remove("flash"),1600);
}
document.querySelectorAll(".presets button").forEach(b=> b.onclick=()=>startTimer(+b.dataset.s));
document.getElementById("tStart").onclick=()=>{ if(tickId) stopTimer(); else startTimer(remain>0?remain:90); };
document.getElementById("tAdd").onclick=()=>{ remain+=15; paintClock(); };
document.getElementById("tReset").onclick=()=>{ stopTimer(); remain=90; paintClock(); };

  document.getElementById("viewProgress").classList.toggle("hidden",which!=="p");
  document.getElementById("timerDock").classList.toggle("hidden",which!=="w");
  document.getElementById("navW").classList.toggle("active",which==="w");
  document.getElementById("navP").classList.toggle("active",which==="p");
  if(which==="p") renderProgress();
}
const lbEl=document.getElementById("lb");
lbEl.onclick=(e)=>{ if(e.target.id==="lb"||e.target.id==="lbx") lbEl.classList.remove("open"); };
document.getElementById("navW").onclick=()=>showView("w");
document.getElementById("navP").onclick=()=>showView("p");
document.getElementById("wPrev").onclick=()=>{ if(state.week>1){state.week--;save();renderWorkout();} };
document.getElementById("wNext").onclick=()=>{ state.week++; save(); renderWorkout(); };

function renderAll(){ renderDays(); renderWorkout(); paintClock(); }
renderAll();
</script>
</body>
</html>
